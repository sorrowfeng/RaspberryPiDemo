[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raspberry-pi-demo"
version = "0.1.0"
description = "LHandPro Raspberry Pi control / aging demo (CANFD / ECAT / RS485)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "keyboard~=0.13.5",
  "pysoem~=1.1.12",
  "pyserial>=3.5",
]

[project.optional-dependencies]
pi = ["RPi.GPIO>=0.7.0"]
dev = ["pytest>=7"]

[project.scripts]
rpd-main = "main:main"
rpd-launch = "launch:main"

[tool.setuptools]
py-modules = [
  "active_config", "launch", "main",
]
packages = [
  "app",
  "device",
  "device.canfd",
  "device.canfd.gsusb_canfd",
  "device.transports",
  "power_cycle",
  "configs",
  "sequences",
  "motion_system",
  "tools",
]
